[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maint-agent"
version = "0.1.0"
description = "A retrieval-augmented maintenance agent for industrial drives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.143.1",
    "jieba==0.42.1",
    "numpy==2.2.6",
    "openai==3.30.0",
    "pymupdf==1.28.2",
    "python-dotenv==1.2.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.1.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]
